# CodeQL static analysis — free for public repositories. Findings appear under
# the repository's Security → Code scanning tab and as PR annotations.
#
# C# uses build-mode "none": CodeQL analyses the sources directly without a
# compile, so this runs on Ubuntu even though two projects target
# net8.0-windows. "actions" scans the workflow files themselves (e.g. for
# script injection from untrusted PR titles or branch names).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries also run against unchanged code.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, actions]
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
